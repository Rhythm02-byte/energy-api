<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Energy Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
  <div class="mx-auto max-w-6xl px-4 py-8 sm:px-6">

    <header class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">Energy Dashboard</h1>
        <p class="text-sm text-slate-400">Smart-meter readings, live from the API</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="status" class="rounded-full bg-slate-800 px-3 py-1 text-xs font-medium text-slate-300">Not connected</span>
        <form id="token-form" class="flex items-center gap-2">
          <input id="token" type="password" placeholder="API token" autocomplete="off"
                 class="w-40 rounded-lg border border-slate-700 bg-slate-900 px-3 py-1.5 text-sm placeholder-slate-500 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500">
          <button type="submit" class="rounded-lg bg-emerald-500 px-3 py-1.5 text-sm font-medium text-slate-950 hover:bg-emerald-400">Use</button>
          <button id="forget" type="button" class="rounded-lg border border-slate-700 px-3 py-1.5 text-sm text-slate-300 hover:bg-slate-800">Forget</button>
        </form>
      </div>
    </header>

    <section class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-3">
      <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5">
        <p class="text-xs uppercase tracking-wide text-slate-400">Readings</p>
        <p id="stat-count" class="mt-2 text-3xl font-semibold">–</p>
      </div>
      <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5">
        <p class="text-xs uppercase tracking-wide text-slate-400">Total kWh</p>
        <p id="stat-kwh" class="mt-2 text-3xl font-semibold text-emerald-400">–</p>
      </div>
      <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5">
        <p class="text-xs uppercase tracking-wide text-slate-400">Devices</p>
        <p id="stat-devices" class="mt-2 text-3xl font-semibold">–</p>
      </div>
    </section>

    <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-3">

      <form id="reading-form" class="rounded-2xl border border-slate-800 bg-slate-900 p-6 lg:col-span-1">
        <h2 class="text-lg font-semibold">New reading</h2>
        <p class="mt-1 text-sm text-slate-400">Sends a reading to <code class="text-slate-300">POST /readings</code>.</p>

        <label class="mt-6 block text-sm text-slate-300" for="device-id">Device ID</label>
        <input id="device-id" required maxlength="100" placeholder="meter-1"
               class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm placeholder-slate-600 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500">

        <label class="mt-4 block text-sm text-slate-300" for="kwh">Energy (kWh)</label>
        <input id="kwh" type="number" required min="0" step="any" placeholder="1.25"
               class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm placeholder-slate-600 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500">

        <label class="mt-4 block text-sm text-slate-300" for="timestamp">Timestamp</label>
        <input id="timestamp" type="datetime-local" required
               class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500">

        <button type="submit" class="mt-6 w-full rounded-lg bg-emerald-500 px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-emerald-400 disabled:opacity-50">Send reading</button>
        <p id="form-message" class="mt-3 min-h-5 text-sm"></p>
      </form>

      <div class="space-y-6 lg:col-span-2">
        <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
          <h2 class="text-lg font-semibold">Readings over time</h2>
          <div class="relative mt-4 h-64">
            <canvas id="chart"></canvas>
          </div>
          <p id="chart-empty" class="mt-2 hidden text-sm text-slate-500">No readings yet.</p>
        </div>

        <div class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900">
          <div class="overflow-x-auto">
            <table class="min-w-full text-left text-sm">
              <thead class="border-b border-slate-800 bg-slate-900 text-xs uppercase tracking-wide text-slate-400">
                <tr>
                  <th class="px-5 py-3 font-medium">Device</th>
                  <th class="px-5 py-3 font-medium">kWh</th>
                  <th class="px-5 py-3 font-medium">Timestamp</th>
                </tr>
              </thead>
              <tbody id="rows" class="divide-y divide-slate-800"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
const TOKEN_KEY = "energy-api-token";
const POLL_MS = 5000;
const COLORS = ["#34d399", "#38bdf8", "#f472b6", "#fbbf24", "#a78bfa", "#f87171"];

const $ = (id) => document.getElementById(id);
let timer = null;
let chart = null;

function getToken() {
  try { return sessionStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
}

function saveToken(token) {
  try {
    if (token) sessionStorage.setItem(TOKEN_KEY, token);
    else sessionStorage.removeItem(TOKEN_KEY);
  } catch { /* storage blocked: the token only lasts for this page load */ }
}

function setStatus(text, tone) {
  const colors = {
    ok: "bg-emerald-500/15 text-emerald-300",
    warn: "bg-amber-500/15 text-amber-300",
    error: "bg-rose-500/15 text-rose-300",
  };
  const el = $("status");
  el.textContent = text;
  el.className = `rounded-full px-3 py-1 text-xs font-medium ${colors[tone] || "bg-slate-800 text-slate-300"}`;
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${getToken()}`,
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) throw new Error("unauthorized");
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(typeof body.detail === "string" ? body.detail : "The API rejected that reading.");
  }
  return res.json();
}

function renderStats(readings) {
  const total = readings.reduce((sum, r) => sum + r.kwh, 0);
  const devices = new Set(readings.map((r) => r.device_id));
  $("stat-count").textContent = readings.length;
  $("stat-kwh").textContent = total.toFixed(2);
  $("stat-devices").textContent = devices.size;
}

function renderChart(readings) {
  const byDevice = new Map();
  for (const r of readings) {
    if (!byDevice.has(r.device_id)) byDevice.set(r.device_id, []);
    byDevice.get(r.device_id).push({ x: Date.parse(r.timestamp), y: r.kwh });
  }
  const datasets = [...byDevice].map(([device, points], i) => ({
    label: device,
    data: points.sort((a, b) => a.x - b.x),
    borderColor: COLORS[i % COLORS.length],
    backgroundColor: COLORS[i % COLORS.length],
    tension: 0.3,
    pointRadius: 3,
  }));

  $("chart-empty").classList.toggle("hidden", readings.length > 0);

  if (!chart) {
    chart = new Chart($("chart"), {
      type: "line",
      data: { datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        parsing: false,
        animation: false,
        scales: {
          x: {
            type: "linear",
            ticks: {
              color: "#94a3b8",
              callback: (v) => new Date(v).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }),
            },
            grid: { color: "#1e293b" },
          },
          y: {
            beginAtZero: true,
            title: { display: true, text: "kWh", color: "#94a3b8" },
            ticks: { color: "#94a3b8" },
            grid: { color: "#1e293b" },
          },
        },
        plugins: { legend: { labels: { color: "#cbd5e1" } } },
      },
    });
  } else {
    chart.data.datasets = datasets;
    chart.update();
  }
}

function renderTable(readings) {
  const body = $("rows");
  body.replaceChildren();
  // Newest first. Text goes in with textContent so a device ID can't inject HTML.
  for (const r of [...readings].reverse()) {
    const row = document.createElement("tr");
    row.className = "hover:bg-slate-800/50";
    const cells = [
      r.device_id,
      r.kwh.toFixed(2),
      new Date(r.timestamp).toLocaleString(),
    ];
    for (const text of cells) {
      const td = document.createElement("td");
      td.className = "px-5 py-3 text-slate-200";
      td.textContent = text;
      row.appendChild(td);
    }
    body.appendChild(row);
  }
  if (readings.length === 0) {
    const row = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 3;
    td.className = "px-5 py-6 text-center text-slate-500";
    td.textContent = "No readings yet.";
    row.appendChild(td);
    body.appendChild(row);
  }
}

async function refresh() {
  if (!getToken()) {
    setStatus("Enter your API token", "warn");
    return;
  }
  try {
    const readings = await api("/readings");
    renderStats(readings);
    renderChart(readings);
    renderTable(readings);
    setStatus(`Live · updated ${new Date().toLocaleTimeString()}`, "ok");
  } catch (err) {
    if (err.message === "unauthorized") {
      setStatus("Token rejected", "error");
      stopPolling();
    } else {
      setStatus("API unreachable", "error");
    }
  }
}

function startPolling() {
  stopPolling();
  refresh();
  timer = setInterval(refresh, POLL_MS);
}

function stopPolling() {
  if (timer) clearInterval(timer);
  timer = null;
}

function defaultTimestamp() {
  // datetime-local wants local time without a timezone suffix.
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  return now.toISOString().slice(0, 16);
}

$("token-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const token = $("token").value.trim();
  if (!token) return;
  saveToken(token);
  $("token").value = "";
  startPolling();
});

$("forget").addEventListener("click", () => {
  saveToken("");
  stopPolling();
  setStatus("Not connected", "warn");
});

$("reading-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const button = e.submitter || e.target.querySelector("button[type=submit]");
  const message = $("form-message");
  const payload = {
    device_id: $("device-id").value.trim(),
    kwh: Number($("kwh").value),
    timestamp: new Date($("timestamp").value).toISOString(),
  };

  button.disabled = true;
  try {
    await api("/readings", { method: "POST", body: JSON.stringify(payload) });
    message.textContent = "Reading saved.";
    message.className = "mt-3 min-h-5 text-sm text-emerald-400";
    $("kwh").value = "";
    $("timestamp").value = defaultTimestamp();
    refresh();
  } catch (err) {
    message.textContent = err.message === "unauthorized" ? "Enter a valid API token first." : err.message;
    message.className = "mt-3 min-h-5 text-sm text-rose-400";
  } finally {
    button.disabled = false;
  }
});

$("timestamp").value = defaultTimestamp();
if (getToken()) startPolling(); else setStatus("Enter your API token", "warn");
</script>
</body>
</html>
